plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.2.2'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // reading/writing to a csv isnt particularly difficult, but every little helps
    // Source: https://mvnrepository.com/artifact/org.apache.commons/commons-csv
    implementation 'org.apache.commons:commons-csv:1.14.1'

    // libraries for reading/writing xlsx and xls files
    // Source: https://mvnrepository.com/artifact/org.apache.poi/poi
    implementation 'org.apache.poi:poi:6.0.0'
    implementation 'org.apache.poi:poi-ooxml:6.0.0'
}

shadowJar {
    mergeServiceFiles()
}